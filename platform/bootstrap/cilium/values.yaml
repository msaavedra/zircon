# platform/bootstrap/cilium/values.yaml

k8sServiceHost: 10.235.2.13
k8sServicePort: 6443

operator:
  replicas: 1

# Replace kube-proxy
kubeProxyReplacement: true

nodePort:
  enabled: true

# Replace MetalLB (L2 Announcements & LB-IPAM)
l2announcements:
  enabled: true

externalIPs:
  enabled: true

loadBalancer:
  acceleration: disabled
  mode: snat

# Replace ingress-nginx
ingressController:
  enabled: true
  loadbalancerMode: shared
  default: true

# Gateway API support (Modern Ingress)
gatewayAPI:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

ipam:
  mode: kubernetes

rollOutCiliumPods: true
