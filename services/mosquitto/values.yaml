image:
  repository: eclipse-mosquitto
  tag: 2.0.20
  pullPolicy: IfNotPresent

ports:
  mqtt:
    port: 1883
    nodePort: 31883
    protocol: TCP

persistence:
  enabled: true
  existingClaim: mosquitto-data
  size: 2Gi

config: |
  persistence true
  persistence_location /mosquitto/data/
  log_dest stdout
  listener 1883
  allow_anonymous true

acls: |
  topic readwrite #
