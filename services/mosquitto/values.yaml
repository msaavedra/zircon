image:
  repository: eclipse-mosquitto
  tag: 2.0.20
  pullPolicy: IfNotPresent

service:
  type: NodePort

ports:
  mqtt:
    port: 1883
    nodePort: 31883
    protocol: TCP
  websocket:
    port: 9090
    nodePort: 31090
    protocol: TCP

securityContext:
  runAsUser: 1883
  runAsGroup: 1883

persistence:
  enabled: true
  existingClaim: mosquitto-data
  size: 2Gi

config: |
  persistence true
  persistence_location /mosquitto/data/
  log_dest stdout
  listener 1883
  listener 9090
  protocol websockets
  allow_anonymous true

acls: |
  topic readwrite #

deployment:
  annotations:
    checksum/values: "{{ .Values | toJson | sha256sum }}"
