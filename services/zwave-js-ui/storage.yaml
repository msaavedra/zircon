apiVersion: v1
kind: PersistentVolume
metadata:
  name: zwave-js-ui-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /srv/apps/zwave-js-ui/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zwave-js-ui-data
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: zwave-js-ui-data
  resources:
    requests:
      storage: 1Gi