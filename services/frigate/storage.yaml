apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /srv/apps/frigate/config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: frigate-data
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /srv/apps/frigate/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-data
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: frigate-data
  resources:
    requests:
      storage: 30Gi
