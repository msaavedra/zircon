
persistence:
  data:
    enabled: true
    type: pvc
    existingClaim: frigate-data
    size: 30Gi
  media:
    enabled: true
    type: hostPath
    hostPath: /srv/media/video/cameras
  cache:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    mountPath: /dev/shm

service:
  main:
    ports:
      http:
        enabled: true
        primary: true
        type: ClusterIP
        clusterIP: ""
        port: 5000

cameras:
  dummy_camera:
    enabled: False  # Prevents Frigate from actually trying to connect
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:554/rtsp
          roles:
            - detect

mqtt:
  enabled: false

deployment:
  annotations:
    checksum/values: "{{ .Values | toJson | sha256sum }}"
