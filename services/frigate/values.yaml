image:
  repository: ghcr.io/blakeblackshear/frigate
  tag: 0.13.2
  pullPolicy: IfNotPresent

env:
  TZ: America/Los_Angeles

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: frigate-data
    size: 30Gi
  data:
    enabled: false
  media:
    enabled: true
    type: hostPath
    hostPath: /srv/media/video/cameras
  cache:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    mountPath: /dev/shm

service:
  main:
    ports:
      http:
        enabled: true
        primary: true
        type: ClusterIP
        clusterIP: ""
        port: 5000
      rtmp:
        enabled: false

securityContext:
  privileged: true

resources:
  requests:
    cpu: 2000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 6Gi

configmap:
  config:
    enabled: true
    data:
      config.yml: |
        mqtt:
          enabled: false

        detectors:
          cpu1:
            type: cpu

        cameras:
          front:
            ffmpeg:
              inputs:
                - path: http://10.235.3.2/streaming/Channels/1/httpPreview
                  roles:
                    - detect
                    - record
            detect:
              width: 352
              height: 240
              fps: 5

deployment:
  annotations:
    checksum/values: "{{ .Values | toJson | sha256sum }}"
