image:
  repository: jellyfin/jellyfin
  tag: latest

service:
  type: ClusterIP
  port: 8096

jellyfin:
  env:
    - name: JELLYFIN_CACHE_DIR
      value: /config/cache

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: jellyfin-config
    size: 30Gi
  cache:
    enabled: false
  media:
    enabled: true
    type: hostPath
    hostPath: /srv/media
    readOnly: true

podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsUser: 2000
  runAsGroup: 2000
  capabilities:
    add:
      - "SYS_ADMIN"
    drop:
      - "ALL"
  privileged: false

resources:
  requests:
    cpu: "200m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "4Gi"

extraVolumes:
  - name: hwa
    hostPath:
      path: /dev/dri

extraVolumeMounts:
  - name: hwa
    mountPath: /dev/dri

deployment:
  annotations:
    checksum/values: "{{ .Values | toJson | sha256sum }}"
