apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 10.4.1
    helm:
      values: |
        config:
          database:
            DB_TYPE: sqlite3
            PATH: /data/gitea/gitea.db
          server:
            DOMAIN: gitea.agate.home
            ROOT_URL: http://gitea.agate.home/
            SSH_DOMAIN: gitea.agate.home
            SSH_PORT: 22
            SSH_LISTEN_PORT: 22
    
        persistence:
          enabled: true
          storageClass: local-path
          size: 10Gi
        
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000

        service:
          http:
            type: ClusterIP
            clusterIP: ""
            port: 3000
        
          ssh:
            type: NodePort
            clusterIP: ""
            nodePort: 32222
        
        postgresql:
          enabled: false
    
        postgresql-ha:
          enabled: false
    
        redis:
          enabled: false
    
        redis-cluster:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: services

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
