image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: 2026.1.3
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsUser: 2000
  runAsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 2000

hostPort:
  enabled: true
  port: 8123

hostNetwork: true

configuration:
  enabled: true

  # Narrow this down after we finish setting up new proxy server.
  trusted_proxies:
    - 10.235.2.0/24

  persistence:
    enabled: true
    existingClaim: hass-data

deployment:
  annotations:
    checksum/values: "{{ .Values | toJson | sha256sum }}"
