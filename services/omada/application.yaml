apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omada
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/msaavedra/zircon.git
      targetRevision: main
      path: services/omada/kustomize
      kustomize:
        helmCharts:
          - name: omada-controller
            repo: oci://registry-1.docker.io/mbentley/omada-controller-helm
            version: 1.0.2
            releaseName: omada
            # This points to the file in Source 2 using the ref
            valuesInline:
              - $values/services/omada/values.yaml
        patches:
          - target:
              kind: StatefulSet
              name: omada-omada-controller
            patch: |-
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  runAsUser: 2000
                  runAsGroup: 2000
                  fsGroup: 2000

    - repoURL: https://github.com/msaavedra/zircon.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: services

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
